<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Hub 更新公告</title>
<style>
  :root {
    --ink0: #0b0d12;
    --text-hi: #e9eef7;
    --text-mid: #b9c2d4;
    --text-lo: #6b7488;
    --line: #262d3c;
    --accent: #6c8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 26px 22px 40px;
    background: var(--ink0);
    color: var(--text-hi);
    font: 15px/1.75 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  h1 {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 20px;
    letter-spacing: .3px;
  }
  p { color: var(--text-mid); margin: 0 0 14px; }
  hr {
    border: 0;
    border-top: 1px solid var(--line);
    margin: 24px 0 16px;
  }
  .meta { color: var(--text-lo); font-size: 12px; margin: 0; }
  a { color: var(--accent); }
</style>
</head>
<body>

<h1>AI Hub 更新公告</h1>

<p>测试</p>

<hr>
<p class="meta">最后更新：2026-10-19</p>

</body>
</html>
